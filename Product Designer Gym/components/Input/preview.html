<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
  <link rel="stylesheet" href="../../tokens.css">
  <link rel="stylesheet" href="../bundle.css">
</head>
<body>
<div class="pdg-stack" style="align-items:flex-start">
  <div class="pdg-field">
    <label class="caption pdg-field__label" for="i1">Project name</label>
    <input class="body pdg-input" id="i1" placeholder="e.g. Checkout redesign" aria-describedby="h1">
    <p class="caption pdg-field__hint" id="h1">Shown on your portfolio card.</p>
  </div>
  <div class="pdg-field pdg-field--error">
    <label class="caption pdg-field__label" for="i2">Time limit (minutes)</label>
    <input class="body pdg-input" id="i2" value="0" aria-invalid="true" aria-describedby="h2">
    <p class="caption pdg-field__hint" id="h2">Error: enter at least 5 minutes.</p>
  </div>
</div>
<script></script>
</body></html>
